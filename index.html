<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Continuum — Physics, Chemistry, Astronomy &amp; More</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<!-- The tab favicon above is vector (crisp at any size already) — these are
     specifically for "Add to Home Screen"/PWA install, where iOS and
     Android need real, high-resolution raster icons (Safari otherwise
     falls back to a blurry screenshot of the page as the app icon). -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#38bdf8" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="topbar">
  <div class="brand" id="brand-home-btn" role="button" title="Home">
    <svg class="brand-logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-1)" stroke-width="1.7" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-2)" stroke-width="1.7" transform="rotate(60 12 12)" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-3)" stroke-width="1.7" transform="rotate(120 12 12)" />
      <circle cx="12" cy="12" r="2.1" style="fill: var(--text)" />
    </svg>
    Continuum
  </div>
  <div id="mode-tabs">
    <button id="mode-physics-btn" class="mode-tab">Physics</button>
    <button id="mode-chemistry-btn" class="mode-tab">Chemistry</button>
    <button id="mode-astronomy-btn" class="mode-tab">Astronomy</button>
    <button id="mode-history-btn" class="mode-tab">History</button>
    <button id="mode-cybersecurity-btn" class="mode-tab">Cybersecurity</button>
    <button id="mode-particles-btn" class="mode-tab">Particle Physics</button>
    <button id="mode-mathematics-btn" class="mode-tab">Mathematics</button>
    <button id="mode-whiteboard-btn" class="mode-tab">Whiteboard</button>
    <button id="mode-economics-btn" class="mode-tab">Economics</button>
  </div>
  <button id="quiz-btn">Quiz</button>
  <button id="tutorial-btn" title="A guided tour of what each section can do">Tutorial</button>
  <div id="account-controls">
    <span id="account-email" class="hidden"></span>
    <button id="account-btn">Sign In</button>
    <button id="signout-btn" class="hidden">Sign Out</button>
  </div>
  <button id="units-toggle-btn" title="Switch units of measurement (metric/imperial)">m/kg</button>
  <button id="device-mode-btn" title="Change device mode (mobile/computer)">📱</button>
  <button id="theme-toggle" title="Toggle light/dark theme">🌙</button>
</header>

<div id="home-root" class="hidden"></div>

<div id="workspace">
  <div id="physics-toolbar">
    <div id="run-controls">
      <button id="play-btn" title="Space">▶ Play</button>
      <span class="hint">space</span>
      <button id="reset-btn" title="Reset the simulation back to your blueprint and run it again">Reset</button>
      <span class="hint">R</span>
    </div>
    <div id="gravity-controls">
      <label>Gravity <span id="gravity-val">1.0</span>x</label>
      <input id="gravity-slider" type="range" min="-2" max="3" step="0.1" value="1" />
      <button id="gravity-reset-btn" title="Reset gravity to 1.0x">Reset</button>
    </div>
    <div id="speed-controls">
      <label>Speed <span id="speed-val">1.0</span>x</label>
      <input id="speed-slider" type="range" min="0.1" max="3" step="0.1" value="1" />
      <button id="speed-reset-btn" title="Reset speed to 1.0x">Reset</button>
    </div>
    <div id="light-mode-toggle-wrap">
      <button id="light-mode-btn" title="Show light rays through glass/lenses">Light Mode</button>
      <button id="field-mode-btn" title="Show every magnet's field lines">Show Field</button>
    </div>
    <div id="file-controls">
      <button id="challenges-btn" class="primary">Physics Challenges</button>
      <button id="my-worlds-btn">My Worlds</button>
      <button id="undo-btn" title="Undo (Ctrl/Cmd+Z)" disabled>↶</button>
      <button id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)" disabled>↷</button>
      <button id="clear-btn">Clear</button>
    </div>
  </div>

  <div id="workspace-body">
    <aside id="palette"></aside>

    <main id="canvas-wrap">
      <svg id="canvas"></svg>
      <div id="mode-banner" class="hidden">SIMULATING — space to stop</div>
      <div id="grid-scale-badge" title="Every grid square is 1 meter — position, size, and weight fields in the panel are in the same units">1 square = 1 m</div>
    </main>

    <aside id="physics-math-panel"></aside>

    <aside id="prop-panel">
      <div class="panel-empty">Select an object to edit its properties.</div>
    </aside>
  </div>
</div>

<div id="chemistry-root" class="hidden"></div>

<div id="astronomy-root" class="hidden"></div>

<div id="history-root" class="hidden"></div>

<div id="cybersecurity-root" class="hidden"></div>

<div id="particles-root" class="hidden">
  <div id="particles-subnav">
    <button class="particles-tab active" data-demo="disjoint-graph.html">Disjoint Graph</button>
    <button class="particles-tab" data-demo="force-lattice.html">Force Lattice</button>
    <button class="particles-tab" data-demo="pointer-field.html">Pointer Field</button>
    <button class="particles-tab" data-demo="radial-tree.html">Epidemic Spread</button>
    <button class="particles-tab" data-demo="gravity-wells.html">Gravity Wells</button>
    <button class="particles-tab" data-demo="swarm-box.html">Swarm Box</button>
    <button class="particles-tab" data-demo="magnetic-charges.html">Magnetic Charges</button>
    <button class="particles-tab" data-demo="flocking.html">Percolation</button>
  </div>
  <iframe id="particles-frame" src="particle-physics/disjoint-graph.html" title="Particle Physics"></iframe>
</div>

<div id="mathematics-root" class="hidden"></div>

<div id="whiteboard-root" class="hidden"></div>

<div id="economics-root" class="hidden"></div>

<div id="challenges-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Challenges</h2>
    <div id="challenges-items"></div>
    <button id="challenges-close">Close</button>
  </div>
</div>

<div id="quiz-modal" class="modal hidden">
  <div class="modal-box" id="quiz-modal-box"></div>
</div>

<div id="auth-modal" class="modal hidden">
  <div class="modal-box" id="auth-modal-box"></div>
</div>

<div id="saves-modal" class="modal hidden">
  <div class="modal-box" id="saves-modal-box"></div>
</div>

<div id="popup-modal" class="modal hidden">
  <div class="modal-box" id="popup-modal-box"></div>
</div>

<div id="challenge-toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
