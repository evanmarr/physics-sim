<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Continuum — Physics, Chemistry, Astronomy &amp; More</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="topbar">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-1)" stroke-width="1.7" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-2)" stroke-width="1.7" transform="rotate(60 12 12)" />
      <ellipse cx="12" cy="12" rx="10" ry="4.2" fill="none" style="stroke: var(--cool-3)" stroke-width="1.7" transform="rotate(120 12 12)" />
      <circle cx="12" cy="12" r="2.1" style="fill: var(--text)" />
    </svg>
    Continuum
  </div>
  <div id="mode-tabs">
    <button id="mode-home-btn" class="mode-tab active">Home</button>
    <button id="mode-physics-btn" class="mode-tab">Physics</button>
    <button id="mode-chemistry-btn" class="mode-tab">Chemistry</button>
    <button id="mode-astronomy-btn" class="mode-tab">Astronomy</button>
    <button id="mode-history-btn" class="mode-tab">History</button>
    <button id="mode-cybersecurity-btn" class="mode-tab">Cybersecurity</button>
    <button id="mode-particles-btn" class="mode-tab">Particle Physics</button>
  </div>
  <div id="run-controls">
    <button id="play-btn" title="Space">▶ Play</button>
    <span class="hint">space</span>
  </div>
  <div id="gravity-controls">
    <label>Gravity <span id="gravity-val">1.0</span>x</label>
    <input id="gravity-slider" type="range" min="-2" max="3" step="0.1" value="1" />
  </div>
  <div id="light-mode-toggle-wrap">
    <button id="light-mode-btn" title="Show light rays through glass/lenses">💡 Light Mode</button>
  </div>
  <div id="file-controls">
    <button id="quiz-btn">Quiz</button>
    <button id="challenges-btn">Challenges</button>
    <button id="clear-btn">Clear</button>
  </div>
  <button id="theme-toggle" title="Toggle light/dark theme">🌙</button>
</header>

<div id="home-root" class="hidden"></div>

<div id="workspace">
  <aside id="palette"></aside>

  <main id="canvas-wrap">
    <svg id="canvas"></svg>
    <div id="mode-banner" class="hidden">SIMULATING — space to stop</div>
  </main>

  <aside id="physics-math-panel"></aside>

  <aside id="prop-panel">
    <div class="panel-empty">Select an object to edit its properties.</div>
  </aside>
</div>

<div id="chemistry-root" class="hidden"></div>

<div id="astronomy-root" class="hidden"></div>

<div id="history-root" class="hidden"></div>

<div id="cybersecurity-root" class="hidden"></div>

<div id="particles-root" class="hidden">
  <div id="particles-subnav">
    <button class="particles-tab active" data-demo="disjoint-graph.html">Disjoint Graph</button>
    <button class="particles-tab" data-demo="force-lattice.html">Force Lattice</button>
    <button class="particles-tab" data-demo="pointer-field.html">Pointer Field</button>
    <button class="particles-tab" data-demo="radial-tree.html">Radial Tree</button>
    <button class="particles-tab" data-demo="gravity-wells.html">Gravity Wells</button>
    <button class="particles-tab" data-demo="swarm-box.html">Swarm Box</button>
    <button class="particles-tab" data-demo="magnetic-charges.html">Magnetic Charges</button>
    <button class="particles-tab" data-demo="flocking.html">Flocking</button>
  </div>
  <iframe id="particles-frame" src="particle-physics/disjoint-graph.html" title="Particle Physics"></iframe>
</div>

<div id="challenges-modal" class="modal hidden"
  <div class="modal-box">
    <h2>Challenges</h2>
    <div id="challenges-items"></div>
    <button id="challenges-close">Close</button>
  </div>
</div>

<div id="quiz-modal" class="modal hidden">
  <div class="modal-box" id="quiz-modal-box"></div>
</div>

<div id="challenge-toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
