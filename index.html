<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contraption — 2D Physics Sandbox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="topbar">
  <div class="brand">Contraption</div>
  <div id="mode-tabs">
    <button id="mode-physics-btn" class="mode-tab active">⚙ Physics</button>
    <button id="mode-chemistry-btn" class="mode-tab">⚗ Chemistry</button>
  </div>
  <div id="run-controls">
    <button id="play-btn" title="Space">▶ Play</button>
    <span class="hint">space</span>
  </div>
  <div id="gravity-controls">
    <label>Gravity <span id="gravity-val">1.0</span>x</label>
    <input id="gravity-slider" type="range" min="-2" max="3" step="0.1" value="1" />
  </div>
  <div id="coin-display">
    <span class="coin-icon">●</span><span id="coin-count">0</span>
    <button id="shop-btn">Shop</button>
    <button id="challenges-btn">Challenges</button>
  </div>
  <div id="file-controls">
    <button id="clear-btn">Clear</button>
  </div>
</header>

<div id="workspace">
  <aside id="palette"></aside>

  <main id="canvas-wrap">
    <svg id="canvas"></svg>
    <div id="mode-banner" class="hidden">SIMULATING — space to stop</div>
  </main>

  <aside id="prop-panel">
    <div class="panel-empty">Select an object to edit its properties.</div>
  </aside>
</div>

<div id="chemistry-root" class="hidden"></div>

<div id="shop-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Shop</h2>
    <div id="shop-items"></div>
    <button id="shop-close">Close</button>
  </div>
</div>

<div id="challenges-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Challenges</h2>
    <div id="challenges-items"></div>
    <button id="challenges-close">Close</button>
  </div>
</div>

<div id="challenge-toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
