<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — Kinetic</title>
<meta name="theme-color" content="#38bdf8" />
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1c1f26; --dim:#6b7280; --accent:#3b6fe0; --border:#d8dce2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1e24; --panel:#23272f; --text:#e7e9ee; --dim:#9aa1af; --accent:#4f8cff; --border:#383e4a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:420px; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:32px 24px; }
  img { width:72px; height:72px; }
  h1 { font-size:22px; margin:12px 0 8px; }
  p { color:var(--dim); margin:0 0 20px; }
  button { font:inherit; font-weight:600; background:var(--accent); color:#0b1220; border:0; border-radius:8px; padding:10px 22px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/kinetic-logo-transparent.png" alt="" />
  <h1>You're offline</h1>
  <p>Kinetic couldn't reach the network, and this page isn't saved on your device yet. Reconnect and try again — anything you've already opened keeps working offline.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
